services:
  postgres:
    # Versão mais estável para evitar erros:
    image: "postgres:15"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=root
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: production
    ports:
      - 8080:8080
    depends_on:
      - postgres
    # Adicionado caso tenha problema de conexão com o banco:
    restart: on-failure
